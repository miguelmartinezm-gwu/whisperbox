steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/whisperbox-http:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/whisperbox-http:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'whisperbox-http'
      - '--image=gcr.io/$PROJECT_ID/whisperbox-http:$COMMIT_SHA'
      - '--region=us-central1'
      - '--allow-unauthenticated'
images:
  - 'gcr.io/$PROJECT_ID/whisperbox-http:$COMMIT_SHA'
